# Local / server stack:  docker compose up -d --build
# Production (with HTTPS via Caddy):  docker compose --profile proxy up -d --build
# Container logs are capped, so a busy or crash-looping service can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sbc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-samebutcheaper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbc} -d ${POSTGRES_DB:-samebutcheaper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sbc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-samebutcheaper}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-hello@samebutcheaper.com}
      # Affiliate IDs are read at build time from .env (see next.config.ts).
      secrets:
        - affiliate
    restart: unless-stopped
    logging: *logging
    init: true
    # Time for in-flight requests and the click and lookup writes queued behind them to finish.
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sbc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-samebutcheaper}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Nightly pg_dump into ./backups, newest 14 kept (BACKUP_KEEP_DAYS). Copy that folder off the server too.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    init: true
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sbc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-samebutcheaper}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:

secrets:
  affiliate:
    file: .env
