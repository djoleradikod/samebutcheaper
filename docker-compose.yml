# Local / server stack:  docker compose up -d --build
# Production (with HTTPS via Caddy):  docker compose --profile proxy up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sbc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-samebutcheaper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbc} -d ${POSTGRES_DB:-samebutcheaper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sbc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-samebutcheaper}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        AMAZON_ASSOCIATE_TAG: ${AMAZON_ASSOCIATE_TAG:-}
        AMAZON_TAGS: ${AMAZON_TAGS:-}
        WALMART_AFFILIATE_TEMPLATE: ${WALMART_AFFILIATE_TEMPLATE:-}
        TARGET_AFFILIATE_TEMPLATE: ${TARGET_AFFILIATE_TEMPLATE:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sbc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-samebutcheaper}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
