name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sbc
          POSTGRES_PASSWORD: sbc
          POSTGRES_DB: sbc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbc -d sbc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database: the tests apply the migrations and empty the tables.
      TEST_DATABASE_URL: postgres://sbc:sbc@localhost:5432/sbc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate catalog
        run: npm run catalog
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and database tests
        run: npm test
      - run: npm run build
      - name: End-to-end tests against the built site
        run: npm run test:e2e
      # Browser checks (scripts/ci/quality.mjs): axe at phone and desktop width, no sideways scroll at 390 px, and
      # the performance budget in scripts/ci/quality.config.json. playwright and @axe-core/playwright are pinned
      # devDependencies (installed by npm ci above) at the versions the budgets were measured with; only the browser
      # is fetched here.
      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium
      - name: Accessibility, phone width and performance budget
        run: node scripts/ci/quality.mjs
      # The server deploy, end to end, on this runner (about two minutes): deploy-remote.sh unchanged against real
      # processes, migrations and backups; blue/green, rollback, a failing health check, the refusals, a backup
      # restored into a second database, and the database going away and coming back (docs/deploy.md, "The rehearsal").
      - name: Launch rehearsal
        env:
          REHEARSAL_PG: postgres://sbc:sbc@localhost:5432/postgres
        run: bash scripts/ci/rehearse-deploy.sh standalone
      - name: Keep the quality numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality
          path: .next/quality.json
          if-no-files-found: ignore

  # The site as it reads once the affiliate programmes' display rules apply (src/lib/programme-terms.ts): every price a
  # programme's terms withhold is withheld. Pages change only in that state, so it needs its own build; a job of its
  # own, beside the one above, so it adds no time to it (measured: build 2 min 23 s, browser checks 2 min 55 s).
  terms-on:
    runs-on: ubuntu-latest
    env:
      PROGRAMME_TERMS_ON: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with every programme's rules on
        run: npm run build
      - name: Withheld pages
        run: npx tsx --test scripts/tests/programme-terms.test.ts scripts/tests/programme-terms-pages.test.ts
      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium
      - name: Accessibility, phone width and performance budget, rules on
        run: node scripts/ci/quality.mjs
