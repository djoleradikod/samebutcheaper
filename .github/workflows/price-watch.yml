# Weekly price refresh from licensed sources only (docs/prices.md, affiliate feeds in docs/feeds.md). Runs on
# GitHub's runner, which can reach the sources; nothing runs on our servers. Opens or updates one pull request when
# a price, a stock state, a tracked link or the log changed, and does nothing otherwise. With no feeds configured
# it reads Open Prices alone. Run it by hand from Actions > Price watch > Run workflow.
name: Price watch

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only: change nothing and open no pull request"
        type: boolean
        default: false
      source:
        description: "Which sources to read (feeds only is quickest when trying a new feed)"
        type: choice
        options: [all, feed, open-prices]
        default: all

# Push the branch and open the pull request. GitHub also needs the repository setting "Allow GitHub Actions to
# create and approve pull requests" (Settings > Actions > General); without it the run says so and links the branch.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Optional. Unset or empty means no feeds. One feed per line, [network:]retailer@MARKET=url (docs/feeds.md).
      PRICE_FEED_URLS: ${{ secrets.PRICE_FEED_URLS }}
      # Optional: column corrections, and the column map for a network without its own reader (docs/feeds.md).
      PRICE_FEED_COLUMNS: ${{ secrets.PRICE_FEED_COLUMNS }}
      FLEXOFFERS_API_KEY: ${{ secrets.FLEXOFFERS_API_KEY }}
      BRANCH: price-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh prices
        run: |
          args=(--summary "$RUNNER_TEMP/price-summary.md")
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${{ inputs.source }}" ] && [ "${{ inputs.source }}" != "all" ]; then args+=(--only "${{ inputs.source }}"); fi
          npx tsx scripts/prices/refresh.ts "${args[@]}"
          cat "$RUNNER_TEMP/price-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Anything changed?
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No price changes, nothing to do."; fi

      - name: Validate the catalogue
        if: steps.diff.outputs.changed == 'true'
        run: npm run catalog

      # Database tests skip without TEST_DATABASE_URL; the price rules and catalogue tests run.
      - name: Tests
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -uo pipefail
          git switch -C "$BRANCH"
          git add data/pairs data/bundles data/prices
          git commit -m "Refresh prices from licensed sources, $(date -u +%Y-%m-%d)"
          # One branch, rebuilt from the base each week: an unmerged run's changes are redone, never stacked.
          if ! git push --force origin "$BRANCH" 2> "$RUNNER_TEMP/push.err"; then
            cat "$RUNNER_TEMP/push.err"
            echo "::error title=Could not push the $BRANCH branch::The workflow token may not write to the repository. In Settings > Actions > General > Workflow permissions choose 'Read and write permissions' (or keep 'Read' and leave this workflow's own permissions block, which asks for contents: write, unless your organisation caps it). A branch protection rule matching '$BRANCH' would also block this."
            exit 1
          fi
          {
            cat "$RUNNER_TEMP/price-summary.md"
            echo
            echo "Opened by the price watch workflow (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Check the moved prices before merging; review cases are in data/prices/review.json and on /admin."
          } > "$RUNNER_TEMP/pr-body.md"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated pull request #$number." | tee -a "$GITHUB_STEP_SUMMARY"
          elif ! gh pr create --base "$BASE" --head "$BRANCH" --title "Price watch: refreshed prices" --body-file "$RUNNER_TEMP/pr-body.md" 2> "$RUNNER_TEMP/pr.err"; then
            cat "$RUNNER_TEMP/pr.err"
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH?expand=1"
            if grep -qi "not permitted to create or approve pull requests" "$RUNNER_TEMP/pr.err"; then
              msg="GitHub Actions may not open pull requests in this repository. The new prices are on the '$BRANCH' branch. To let this workflow open the pull request itself: Settings > Actions > General > Workflow permissions, tick 'Allow GitHub Actions to create and approve pull requests', Save (an organisation may need to allow it first, in its own Settings > Actions > General). For this week, open it by hand: $compare"
            else
              msg="Opening the pull request failed (see the log above). The new prices are on the '$BRANCH' branch; open it by hand: $compare"
            fi
            echo "::error title=Pull request not opened::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
